name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- Build Main Version ---
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js (main)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (main)
        run: npm ci

      - name: Remove old build
        run: rm -rf dist

      - name: Build main version (root deploy)
        run: VITE_BASE_PATH=/alpenchallenge/ npm run build

      # --- Build GranFondo Branch Version ---
      - name: Checkout GranFondo branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: GranFondo
          path: GranFondo

      - name: Setup Node.js (GranFondo)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (GranFondo)
        working-directory: GranFondo
        run: npm ci

      - name: Build GranFondo branch version
        working-directory: GranFondo
        run: VITE_BASE_PATH=/alpenchallenge/GranFondo/ npm run build

      - name: Copy GranFondo build into main dist
        run: |
          mkdir -p dist/GranFondo
          cp -r GranFondo/dist/* dist/GranFondo/

      # --- Build GravelRace Branch Version ---
      - name: Checkout GravelRace branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: GravelRace
          path: GravelRace

      - name: Setup Node.js (GravelRace)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (GravelRace)
        working-directory: GravelRace
        run: npm ci

      - name: Build GravelRace branch version
        working-directory: GravelRace
        run: VITE_BASE_PATH=/alpenchallenge/GravelRace/ npm run build

      - name: Copy GravelRace build into main dist
        run: |
          mkdir -p dist/GravelRace
          cp -r GravelRace/dist/* dist/GravelRace/

      - name: Remove unnecessary files
        run: find dist -type l -delete

      - name: Check size of dist
        run: du -sh dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
